# Tüm teknik ve ekonomik varsayımlar burada tutulur. Kod içine değer gömülmez.
# Her değer şu yapıdadır:
#   anahtar: {value: <değer>, unit: <birim>, note: <açıklama>, source: <kaynak>}
# Değerler ilgili fazlarda doldurulacak.

data:
  power_base_url:
    value: https://power.larc.nasa.gov/api/temporal/hourly/point
    note: NASA POWER saatlik nokta verisi endpoint'i
    source: https://power.larc.nasa.gov/docs/services/api/temporal/hourly/
  power_community:
    value: RE
    note: Renewable Energy topluluğu (rüzgar/güneş için uygun birimler)
    source: NASA POWER API dokümantasyonu
  power_parameters:
    value: [WS10M, WS50M, WD10M, WD50M, T2M, PS]
    note: "Birimler (API yanıtından doğrulandı): WS m/s, WD derece, T2M °C, PS kPa"
    source: NASA POWER API yanıtı header/parameters alanı, 2026-10-16
  power_time_standard:
    value: UTC
    note: Zaman damgaları UTC olarak istenir
    source: NASA POWER API dokümantasyonu
  power_fill_value:
    value: -999.0
    note: API'nin eksik veri için kullandığı değer, NaN'a çevrilir
    source: NASA POWER API yanıtı header.fill_value
  default_years:
    value: 5
    unit: yıl
    note: Yıl verilmezse kullanılacak son tam yıl sayısı
    source: Proje talimatı
  request_timeout:
    value: 120
    unit: s
    note: Tek yıllık sorgu için HTTP zaman aşımı
    source: Varsayım (yavaş bağlantılar için geniş tutuldu)
  request_retries:
    value: 3
    note: Başarısız sorguda tekrar deneme sayısı
    source: Varsayım
  max_wind_speed:
    value: 50.0
    unit: m/s
    note: Bu değerin üstündeki hızlar fiziksel olmayan kabul edilip silinir
    source: Proje talimatı
  min_wind_speed:
    value: 0.0
    unit: m/s
    note: Negatif hızlar silinir
    source: Fiziksel sınır
wind_resource:
  gas_constant_dry_air:
    value: 287.05
    unit: J/(kg·K)
    note: Kuru hava özgül gaz sabiti, ρ = P/(R·T)
    source: Proje talimatı; standart değer
  fixed_alpha:
    value: 0.143
    note: Sabit power law üssü (1/7 kuralı), kullanıcı sahaya özel α yerine seçebilir
    source: Manwell vd., Wind Energy Explained (2. baskı), Bölüm 2
  alpha_heights:
    value: [10, 50]
    unit: m
    note: Sahaya özel α hesabında kullanılan NASA POWER ölçüm yükseklikleri
    source: NASA POWER parametreleri (WS10M, WS50M)
  calm_threshold:
    value: 0.5
    unit: m/s
    note: Bu hızın altı sakin kabul edilir (istatistikte raporlanır)
    source: Varsayım
  local_utc_offset:
    value: 3
    unit: saat
    note: Saatlik profilin yerel saatle gösterimi (Türkiye UTC+3)
    source: Türkiye saat dilimi
  wind_rose_sectors:
    value: 16
    note: Rüzgar gülü sektör sayısı
    source: Proje talimatı
  roughness_z0:
    unit: m
    note: Arazi pürüzlülük uzunluğu tablosu (log law)
    source: Manwell vd., Wind Energy Explained (2. baskı), Tablo 2.2 (Wieringa kaynaklı)
    value:
      Durgun açık deniz: 0.0002
      Dalgalı deniz: 0.0005
      Kar yüzeyi: 0.003
      Çimenlik: 0.008
      Engebeli mera: 0.01
      Nadas tarlası: 0.03
      Ekili tarım arazisi: 0.05
      Az ağaçlı arazi: 0.1
      Çok ağaçlı, çitli, seyrek yapılı arazi: 0.25
      Orman ve koruluk: 0.5
      Banliyö: 1.5
      Yüksek binalı şehir merkezi: 3.0
  wind_power_classes:
    unit: W/m²
    note: Sınıf alt sınırları (1. sınıf 0'dan başlar, 7. sınıf üst sınırsız)
    source: Elliott vd. (1986), Wind Energy Resource Atlas of the United States, NREL/PNL
    value:
      10: [0, 100, 150, 200, 250, 300, 400]
      50: [0, 200, 300, 400, 500, 600, 800]
energy:
  standard_density:
    value: 1.225
    unit: kg/m³
    note: Güç eğrilerinin referans hava yoğunluğu (ρ₀)
    source: IEC 61400-12-1
  density_correction_method:
    value: iec
    note: "iec: v_site = v_std·(ρ₀/ρ)^(1/3); svenningsen: değişken üs (windpowerlib)"
    source: IEC 61400-12-1; Svenningsen (2010), windpowerlib power_curve_density_correction
  default_turbine:
    value: E-82/2300
    note: Varsayılan türbin modeli (windpowerlib/oedb kütüphanesi)
    source: windpowerlib 0.2.2 türbin veritabanı
  default_hub_height:
    value: 98
    unit: m
    note: Varsayılan göbek yüksekliği
    source: Varsayım (E-82 için üretici seçeneklerinden biri)
  n_turbines:
    value: 1
    note: Türbin adedi
    source: Kullanıcı girdisi
  hours_per_year:
    value: 8760
    unit: h
    note: Yıllık saat sayısı (AEP ölçekleme)
    source: Standart
losses:
  # Net = Brüt · Π(1 − kᵢ). Değerler oransal (0.05 = %5).
  wake:
    value: 0.05
    note: İz (wake) kaybı; tek türbinde otomatik 0 alınır
    source: Varsayım, tipik aralık %3-10 (küçük çiftlik)
  availability:
    value: 0.03
    note: Türbin ve BOP kullanılabilirlik kaybı
    source: Varsayım, tipik aralık %2-5
  electrical:
    value: 0.02
    note: Trafo, kablo ve iç tüketim kayıpları
    source: Varsayım, tipik aralık %1-3
  turbine_performance:
    value: 0.02
    note: Güç eğrisi sapması, yüksek rüzgar histerezisi
    source: Varsayım, tipik aralık %1-3
  environmental:
    value: 0.01
    note: Buzlanma, kanat kirlenmesi, aşırı sıcaklık
    source: Varsayım, tipik aralık %0.5-3
  curtailment:
    value: 0.01
    note: Şebeke kısıtı ve yük atma
    source: Varsayım, tipik aralık %0-3
economics:
  currency:
    value: USD
    note: Para birimi (kullanıcı değiştirebilir; tüm parasal girdiler bu birimdedir)
    source: Proje talimatı
  capex_per_kw:
    value: 1300
    unit: USD/kW
    note: Toplam yatırım maliyeti; küçük/tek türbinli proje için küresel ortalamanın üstünde
    source: IRENA, Renewable Power Generation Costs in 2023 (karada rüzgar ağırlıklı ort. ≈1160 USD/kW)
  capex_split:
    value: {Türbin: 0.70, İnşaat: 0.12, Şebeke bağlantısı: 0.10, Diğer: 0.08}
    note: CAPEX alt kalem payları (toplamı 1)
    source: IRENA maliyet kırılımına göre tipik oranlar (varsayım)
  opex_per_kw_year:
    value: 40
    unit: USD/kW/yıl
    note: Sabit işletme-bakım gideri
    source: IRENA 2023, tipik aralık 33-45 USD/kW/yıl
  opex_per_mwh:
    value: 0
    unit: USD/MWh
    note: Üretime bağlı değişken OPEX (opsiyonel)
    source: Varsayım
  opex_escalation:
    value: 0.02
    note: OPEX yıllık artış oranı
    source: Varsayım
  incentive_price:
    value: 73
    unit: USD/MWh
    note: Teşvik dönemi satış fiyatı (kullanıcı girdisi; örnek değer)
    source: 5346 sayılı kanun eski YEKDEM rüzgar fiyatı (7.3 USD cent/kWh)
  incentive_years:
    value: 10
    unit: yıl
    note: Teşvik dönemi süresi (0 = teşvik yok)
    source: Eski YEKDEM süresi
  market_price:
    value: 60
    unit: USD/MWh
    note: Teşvik sonrası satış fiyatı (ilk piyasa yılı değeri)
    source: Varsayım
  price_escalation:
    value: 0.01
    note: Piyasa fiyatının yıllık eskalasyonu (teşvik fiyatı sabit)
    source: Varsayım
  discount_rate:
    value: 0.08
    note: İskonto oranı
    source: Varsayım
  lifetime:
    value: 25
    unit: yıl
    note: Proje ömrü
    source: Proje talimatı (20-25 yıl)
  degradation:
    value: 0.003
    note: Yıllık üretim degradasyonu
    source: Varsayım
  tax_rate:
    value: 0.25
    note: Kurumlar vergisi oranı (zarar devri modellenmez)
    source: Türkiye kurumlar vergisi oranı
  depreciation_years:
    value: 10
    unit: yıl
    note: Doğrusal amortisman süresi
    source: Varsayım
  loan_enabled:
    value: false
    note: Kredi kullanımı
    source: Varsayım
  loan_share:
    value: 0.70
    note: CAPEX'in krediyle finanse edilen payı
    source: Varsayım
  loan_rate:
    value: 0.09
    note: Kredi faiz oranı
    source: Varsayım
  loan_term:
    value: 10
    unit: yıl
    note: Kredi vadesi (eşit taksitli anüite)
    source: Varsayım
  aep_sigma:
    value: 0.10
    note: AEP belirsizliği (1σ); P90 = P50·(1 − 1.282σ), P10 = P50·(1 + 1.282σ)
    source: Varsayım (reanaliz verisi, ölçüm yok)
  sensitivity_steps:
    value: [-0.20, -0.10, 0.10, 0.20]
    note: Duyarlılık analizinde uygulanan oransal değişimler
    source: Proje talimatı
environment:
  grid_emission_factor:
    value: 0.438
    unit: tCO₂/MWh
    note: Türkiye geneli elektrik üretimi emisyon faktörü (ortalama). Alternatif birleşik marj (CM) yöntemi TUESEF bilgi formunda
    source: ETKB, 2022 Üretim ve Tüketim Noktası Emisyon Faktörleri
  household_consumption:
    value: 2400
    unit: kWh/yıl
    note: Ortalama konut tüketimi (~200 kWh/ay). Kaynaklar tutarsız (~2400-5000 kWh/yıl); muhafazakâr değer seçildi
    source: AA derlemesi (konutlarda aylık ~200 kWh); TÜİK/EPDK resmi değeri bulunursa güncellenmeli
report:
  university:
    value: İzmir Bakırçay Üniversitesi
    note: Kapakta görünen kurum
    source: Kullanıcı girdisi
  department:
    value: Elektrik-Elektronik Mühendisliği Bölümü
    note: Kapakta görünen bölüm
    source: Kullanıcı girdisi
  course:
    value: Rüzgar Enerjisi
    note: Ders adı
    source: Proje talimatı
  instructor:
    value: ""
    note: Öğretim üyesi (boşsa kapakta görünmez)
    source: Kullanıcı girdisi
  student_no:
    value: ""
    note: Öğrenci numarası (boşsa kapakta görünmez)
    source: Kullanıcı girdisi
  include_map:
    value: true
    note: Rapora OpenStreetMap statik harita ekle (internet gerekir)
    source: Varsayım
